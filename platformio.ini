; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = upesy_wroom

[env:upesy_wroom]
; Plattform und Bibliotheken sind auf die an der Anlage getesteten Versionen festgelegt.
; Ein Update bewusst machen und danach an der Anlage testen: FastLED 3.10 hat z. B. schon einmal
; den Build gebrochen, und ab Arduino-Core 3.x (neuere Plattform) ändert sich die PWM-API (ledcSetup).
platform = espressif32@7.0.1
board = upesy_wroom
framework = arduino
monitor_speed = 115200
; 921600 ist mit dem USB-Kabel der Anlage nicht zuverlässig
upload_speed = 460800
; Tests laufen nur nativ (pio test -e native), nie auf der Anlage
test_ignore = *
lib_deps =
	paulstoffregen/OneWire@2.3.8
	milesburton/DallasTemperature@3.11.0
	fastled/FastLED@3.10.9
	marcoschwartz/LiquidCrystal_I2C@1.1.4
	tzapu/WiFiManager@2.0.17
	knolleary/PubSubClient@2.8

; Unit-Tests auf dem Mac: pio test -e native
; Übersetzt nur die Teile ohne Arduino-Abhängigkeit (Steuerung, Einstellungen, Menü, MQTT-Protokoll).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<core/> +<config/settings.cpp> +<ui/frame.cpp> +<ui/menu.cpp> +<net/protocol.cpp>
build_flags = -I src -Wall -Wextra
