; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = upesy_wroom

[env:upesy_wroom]
platform = espressif32
board = upesy_wroom
framework = arduino
; Tests laufen nur nativ (pio test -e native), nie auf der Anlage
test_ignore = *
lib_deps =
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	fastled/FastLED@^3.9.4
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	janelia-arduino/Vector@^1.2.2
	tzapu/WiFiManager @ ^2.0.11
	knolleary/PubSubClient

; Unit-Tests der Steuerlogik auf dem Mac: pio test -e native
; Übersetzt nur die Teile ohne Arduino-Abhängigkeit (core/ und die Einstellungen).
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<core/> +<config/settings.cpp>
build_flags = -I src -Wall -Wextra
